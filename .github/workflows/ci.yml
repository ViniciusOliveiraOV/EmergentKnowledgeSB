name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Validator selftest
        run: python -m eksb.validate --selftest

      - name: Bundled demo validates clean
        run: python -m eksb.validate eksb/data/demo --warnings-are-errors

  cli:
    name: CLI · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # a first-time user's machine: no config, no workspace, nothing inherited
    env:
      EKSB_CONFIG_DIR: ${{ github.workspace }}/.ci-eksb-config

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from a built package, as a user would
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Entry point
        run: |
          eksb --version
          eksb --help

      - name: Demo, then read it
        run: |
          eksb demo
          eksb search "partitioning"
          eksb get "Time-Range Partitioning"
          eksb provenance "Time-Range Partitioning"
          eksb attention
          eksb validate
          eksb doctor
          eksb about

      - name: Provenance shows who said what (EN)
        shell: bash
        run: |
          eksb --lang en provenance "Time-Range Partitioning" > prov.txt
          cat prov.txt
          grep -q "you said it" prov.txt
          grep -q "an assistant suggested it" prov.txt
          grep -q "is a later version of" prov.txt

      - name: Localization smoke test (pt-BR)
        shell: bash
        run: |
          eksb config --set-lang pt-BR
          eksb attention | tee att.txt
          grep -q "Coisas que precisam da sua atenção" att.txt
          eksb --lang en attention | grep -q "Things that need your attention"
          eksb config | grep -q "Portugu"
          eksb config --set-lang en

      # a relative path, so this works identically under git-bash on Windows
      # where runner.temp is a backslash path bash cannot use
      - name: Workspace in a path with spaces and Unicode
        shell: bash
        run: |
          eksb init "ws test/Meu Espaço EKSB ✓"
          eksb doctor "ws test/Meu Espaço EKSB ✓"
          eksb validate "ws test/Meu Espaço EKSB ✓"

      - name: Writing round-trip
        shell: bash
        run: |
          W="ws test/Meu Espaço EKSB ✓"
          eksb add --type decision "Use Postgres" -w "$W"
          printf 'Me: shard?\nAssistant: maybe.\n' > chat.md
          eksb save chat.md --kind chatgpt -w "$W"
          eksb validate "$W"
          eksb search Postgres -w "$W" | grep -q "Use Postgres"

      - name: Editing raw history is detected
        shell: bash
        run: |
          W="ws test/Meu Espaço EKSB ✓"
          python - "$W" <<'PY'
          import pathlib, sys
          p = next((pathlib.Path(sys.argv[1]) / "_sources").glob("chat*.md"))
          p.write_text(p.read_text(encoding="utf-8").replace("maybe", "yes"),
                       encoding="utf-8")
          PY
          eksb validate "$W" > raw.txt 2>&1 && { echo "expected a mismatch"; exit 1; }
          cat raw.txt
          grep -q "content_hash mismatch" raw.txt
          # put it back, so the steps after this one inherit a clean workspace
          python - "$W" <<'PY'
          import pathlib, sys
          p = next((pathlib.Path(sys.argv[1]) / "_sources").glob("chat*.md"))
          p.write_text(p.read_text(encoding="utf-8").replace("yes", "maybe"),
                       encoding="utf-8")
          PY
          eksb validate "$W"

      - name: Missing workspace is a sentence, not a traceback
        shell: bash
        run: |
          eksb search anything -w "no such folder" > err.txt 2>&1 && exit 1
          cat err.txt
          grep -q "There is no EKSB workspace" err.txt
          ! grep -q "Traceback" err.txt

      - name: Runs with NO_COLOR
        env:
          NO_COLOR: "1"
        run: eksb doctor

      - name: Project ingestion is incremental and keeps history
        shell: bash
        run: |
          W="ws test/Meu Espaço EKSB ✓"
          mkdir -p "proj/docs" "proj/node_modules/dep"
          printf '# Atlas\n\nRead latency is the constraint.\n' > proj/README.md
          printf '# Decisions\n\nAdopted time-range partitioning.\n' > proj/docs/d.md
          printf 'print(1)\n' > proj/main.py
          printf 'junk\n' > proj/node_modules/dep/readme.md

          eksb ingest proj --name Atlas -w "$W" | tee ing1.txt
          grep -q "Indexed Atlas" ing1.txt
          eksb ingest proj -w "$W" | tee ing2.txt
          grep -q "already up to date" ing2.txt
          test "$(ls "$W/_sources" | wc -l)" = "3"   # 2 indexed + the earlier chat

          printf '# Atlas\n\nNow with retention windows.\n' > proj/README.md
          eksb ingest proj -w "$W" | grep -q "changed since last time"
          test "$(ls "$W/_sources" | wc -l)" = "4"   # the old version was kept
          eksb validate "$W"
          eksb projects -w "$W" | grep -q "indexed"

      - name: MCP server answers a real client session
        shell: bash
        run: |
          W="ws test/Meu Espaço EKSB ✓"
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","clientInfo":{"name":"ci"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"eksb_search","arguments":{"query":"latency"}}}'
          } | eksb mcp -w "$W" > mcp.txt
          cat mcp.txt
          test "$(wc -l < mcp.txt)" = "3"
          grep -q '"name": "eksb_submit_candidate"' mcp.txt
          grep -q 'eksb_provenance' mcp.txt

      - name: An agent cannot record its guess as the user's position
        shell: bash
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"eksb_submit_candidate","arguments":{"title":"Nope","claims":[{"text":"x","epistemic":"user_position"}]}}}' \
            | eksb mcp -w "ws test/Meu Espaço EKSB ✓" > guard.txt
          cat guard.txt
          grep -q "REJECTED" guard.txt
          grep -q "may not assert user_position" guard.txt

      # the dogfood bug: the demo becomes the default workspace, and the next
      # `eksb ingest` silently files a real project into the fiction
      - name: Real work cannot be written into the demo
        shell: bash
        run: |
          mkdir -p real/docs && printf '# Real\n\nPrivate.\n' > real/README.md
          eksb demo                                   # demo becomes the default
          eksb search partitioning | grep -q "Time-Range"   # reads still work
          eksb ingest real > dg.txt 2>&1 && exit 1
          cat dg.txt
          grep -q "This is the demo workspace" dg.txt
          grep -q "eksb init" dg.txt
          ! grep -q "Traceback" dg.txt
          eksb add "Real Decision" > dg2.txt 2>&1 && exit 1
          grep -q "This is the demo workspace" dg2.txt
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"eksb_submit_candidate","arguments":{"title":"Real","claims":[{"text":"x","epistemic":"source_claim","source":"s"}],"sources":["s"]}}}' \
            | eksb mcp > dg3.txt
          grep -q "REJECTED" dg3.txt
          grep -q "demo workspace" dg3.txt
          eksb doctor | grep -q "DEMO"
          eksb validate

      # the only command that destroys data, so its guards are checked, not assumed
      - name: Deleting a workspace refuses everything but a real one
        shell: bash
        run: |
          mkdir -p "not a workspace" && printf 'keep me\n' > "not a workspace/f.txt"
          eksb workspace delete "not a workspace" --yes > d1.txt 2>&1 && exit 1
          cat d1.txt
          test -f "not a workspace/f.txt"
          ! grep -q "Traceback" d1.txt

          eksb workspace delete "$HOME" --yes > d2.txt 2>&1 && exit 1
          test -d "$HOME"

          eksb demo sandbox                           # the demo is never deletable
          eksb workspace delete sandbox --yes > d3.txt 2>&1 && exit 1
          cat d3.txt
          eksb validate sandbox                       # still intact

          eksb init disposable
          eksb workspace delete disposable > d4.txt 2>&1 < /dev/null && exit 1
          cat d4.txt
          test -d disposable                          # closed stdin deletes nothing
          eksb workspace delete disposable --yes      # only explicit consent does
          test ! -d disposable

      - name: Connect prints a usable client configuration
        shell: bash
        run: |
          eksb connect --json -w "ws test/Meu Espaço EKSB ✓" > cfg.json
          cat cfg.json
          python -c "import json,sys; c=json.load(open('cfg.json'))['mcpServers']['eksb']; assert c['args'][:3]==['-m','eksb','mcp'], c"
